<!DOCTYPE html>
<html lang="en" data-theme="light" data-color="red">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Billing &amp; Inventory</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Billing">
<link rel="stylesheet" href="styles.css?v=bill-purch130">
<link rel="stylesheet" href="redesign.css?v=bill-purch130">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Sections">
    <div class="brand">
      <div class="logo" aria-hidden="true">▣</div>
      <div style="min-width:0">
        <div class="biz" id="bizName">My Store</div>
        <div class="sub" id="bizSub">Billing &amp; inventory</div>
      </div>
    </div>
    <div class="side-branch">
      <label for="branchSel">Branch</label>
      <select class="inp branch-sel" id="branchSel" aria-label="Active branch"></select>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="btn sm" id="themeBtn" type="button">Dark mode</button>
      <div class="hint" id="sideHint">Saved in this browser</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 id="pageTitle">Dashboard</h1>
      <span class="top-branch" id="topBranch" title="Active branch"></span>
      <div class="grow"></div>

      <div class="who" id="whoChip" title="Signed in">
        <span class="av" id="whoAv">O</span>
        <span class="who-t">
          <b id="whoName">Owner</b>
          <span id="whoRole">Owner / Admin</span>
        </span>
      </div>

      <button class="icon-btn" id="logoutBtn" type="button" aria-label="Sign out" title="Sign out">
        <svg viewBox="0 0 24 24"><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/></svg>
      </button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<button class="fab" id="fabBill" type="button" aria-label="New bill">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  <span>New bill</span>
</button>

<nav class="bnav" id="bnav" aria-label="Quick sections"></nav>
<div class="scrim" id="scrim"></div>

<!-- sign-in screen -->
<div class="login" id="login" hidden>
  <div class="login-card">
    <div class="logo big" aria-hidden="true">▣</div>
    <h2 id="loginBiz">My Store</h2>
    <p class="sub">Sign in to continue</p>
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="loginUser">User ID</label>
        <input class="inp" id="loginUser" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPass">Password</label>
        <input class="inp" id="loginPass" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn primary block" type="submit">Sign in</button>
      <div class="hint" id="loginHint" style="margin-top:10px;text-align:center"></div>
    </form>
  </div>
</div>

<dialog id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="modalTitle">Details</h2>
      <button class="icon-btn" type="button" data-act="close-modal" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="modalBody"></div>
  </div>
</dialog>

<div id="print"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="qrcode.min.js"></script>
<script src="store.js"></script>
<script src="app.js?v=bill-purch130"></script>
<script>
  /* Offline support: the whole app is saved on this device, so it opens without internet. */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
